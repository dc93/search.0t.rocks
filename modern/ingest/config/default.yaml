# Ingest Pipeline Configuration

# Directory to watch for new files
watchDir: /data/incoming

# Directory for temporary extraction
tempDir: /data/temp

# Where to move failed files
failedDir: /data/failed

# Where to move completed files (set to null to delete after import)
completedDir: null

# Elasticsearch configuration
elasticsearch:
  url: http://es01:9200
  index: bigdata
  batchSize: 5000          # Documents per bulk request
  maxConcurrent: 3         # Parallel bulk uploads

# File processing
processing:
  # Supported compressed formats (auto-detected by extension)
  compressedExtensions:
    - .gz
    - .zip
    - .tar.gz
    - .tgz
    - .7z
    - .rar
    - .bz2
    - .xz

  # Supported text formats
  textExtensions:
    - .jsonl
    - .json
    - .csv
    - .tsv
    - .txt
    - .sql

  # Max file size to process (0 = unlimited)
  maxFileSizeBytes: 0

  # Polling interval for new files (ms) — fallback if fs.watch fails
  pollIntervalMs: 10000

# Source tagging: auto-tag records with the source filename
autoTagSource: true

# Field normalizer — maps common alternative field names to schema fields.
# Each schema field has a list of aliases (case-insensitive match).
